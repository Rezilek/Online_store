{% extends 'catalog/base.html' %}

{% block title %}Удаление статьи{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h1 class="mb-4">Удаление статьи</h1>

        <div class="alert alert-warning">
            <h5>Вы уверены, что хотите удалить статью "{{ object.title }}"?</h5>
            <p class="mb-0">Это действие нельзя отменить.</p>
        </div>

        <form method="post">
            {% csrf_token %}
            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                <button type="submit" class="btn btn-danger">Удалить</button>
                <a href="{% url 'blog:post_list' %}" class="btn btn-secondary">Отмена</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
